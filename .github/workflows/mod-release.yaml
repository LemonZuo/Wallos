# Release workflow for this fork. Upstream's build-release.yaml stays in the
# tree untouched (so merging upstream never conflicts) and is disabled in the
# repository's Actions settings instead; this file is the one that runs here.
#
# Images go to GHCR only: ghcr.io/<owner>/wallos
#
#   push to branch mod     -> :mod and :sha-<commit>  (rolling build of the branch)
#   push tag mod-vX.Y.Z-N  -> :mod-vX.Y.Z-N, :latest  + a GitHub release
#   pull request into mod  -> tests and build only, nothing is pushed
#   manual run, tag input  -> releases an existing tag the same way
#
# A release does not rebuild when the commit it points to was already built:
# the image built from that commit (:sha-<commit>, or :mod while it still is
# that commit) is tagged as is, so the release is exactly the image that was
# tested. Only a commit without an image is built from scratch.
#
# Tags: mod-v<upstream version>-<our release number>, e.g. mod-v5.11.1-1, then
# mod-v5.11.1-2 for the next release on the same base, and mod-v5.12.0-1 once
# upstream v5.12.0 is merged. The mod- prefix keeps them out of upstream's v*
# namespace, so syncing upstream tags never collides with ours and nothing that
# matches v* (release-please included) ever picks ours up.
name: Mod Build & Release

on:
  push:
    branches:
      - mod
    tags:
      - "mod-v*"
  pull_request:
    branches:
      - mod
  workflow_dispatch:
    inputs:
      tag:
        description: "Release this existing mod-vX.Y.Z-N tag from the image already built for its commit (leave empty to build the branch)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      is_release: ${{ steps.vars.outputs.is_release }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
      mode: ${{ steps.vars.outputs.mode }}
      source: ${{ steps.vars.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # GHCR wants a lower-case path, the owner is LemonZuo.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wallos"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          fi

          if [[ -z "$tag" ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$tag" =~ ^mod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Tag $tag does not match mod-vX.Y.Z-N (e.g. mod-v5.11.1-1)"
            exit 1
          fi
          if ! commit=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}"); then
            echo "::error::Tag $tag does not exist in this repository"
            exit 1
          fi
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

          # Reuse the image already built from this commit, if there is one.
          for ref in "$image:sha-${commit::7}" "$image:mod"; do
            revision=$(docker buildx imagetools inspect "$ref" --format '{{ json (index .Image "linux/amd64").Config.Labels }}' 2>/dev/null \
              | jq -r '."org.opencontainers.image.revision" // empty' || true)
            if [[ "$revision" == "$commit" ]]; then
              echo "Releasing $ref, built from $commit"
              echo "mode=promote" >> "$GITHUB_OUTPUT"
              echo "source=$ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if [[ -n "$INPUT_TAG" ]]; then
            # A manual run checks out the branch, not the tag, so it cannot build the tag itself.
            echo "::error::No image was built from $commit ($tag). Push the tag again to build it."
            exit 1
          fi
          echo "No image built from $commit yet, building it"
          echo "mode=build" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.mode == 'build'
    container: php:8.3-cli
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite
        run: php tests/run.php

  build:
    runs-on: ubuntu-latest
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
      # necessary for multi-platform images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # always resolve php:8.3-fpm-alpine fresh, so a rebuild picks up base image security fixes
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.prepare.outputs.image) }}
          # Scope cache per platform to prevent architecture-mismatched layers
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.platform }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || matrix.platform == 'linux/arm64' && 'arm64' || 'armv7' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          # The image tag is the git tag itself, so the two never need translating.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,enable=${{ github.ref_type == 'branch' }}
          flavor: |
            latest=${{ needs.prepare.outputs.is_release }}
      - name: Create manifest list and push to GHCR
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # one argument per tag and per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.prepare.outputs.image }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ needs.prepare.outputs.image }}:${{ steps.meta.outputs.version }}

  promote:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.mode == 'promote'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Tag the existing image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          # Same manifest list, same digest: no rebuild.
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" "$SOURCE"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [prepare, merge, promote]
    if: >-
      always() && needs.prepare.outputs.is_release == 'true' &&
      (needs.merge.result == 'success' || needs.promote.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          # Compare against our previous release only, never against upstream's v* tags.
          previous=$(git tag --list 'mod-v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          notes="Docker image: \`$IMAGE:$TAG\` (also \`$IMAGE:latest\`)"
          args=(--title "$TAG" --notes "$notes" --generate-notes --verify-tag)
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" "${args[@]}"
